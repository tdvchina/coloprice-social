name: Instagram post

# Publishes the next ready carousel. Daily limit from config/limits.json (guarded twice:
# the guard step below + content/state.json inside publish.mjs). No Claude here: deterministic node.
on:
  schedule:
    - cron: '7 13 * * 1-5' # 20:07 Asia/Bangkok, Mon–Fri (= 09:07 New York, 14:07 London)
    # Launch burst 28–30 Oct 2026 (config/limits.json: 3/day, >=3h apart). Outside the burst window
    # the publisher's own limit makes these no-ops; remove them after the launch grid is out.
    - cron: '35 13 28 10 *'  # 28 Oct 20:35 Bangkok
    - cron: '50 16 28 10 *'  # 28 Oct 23:50 Bangkok
    - cron: '0 3,7,11 29,30 10 *' # 29–30 Oct 10:00, 14:00, 18:00 Bangkok
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (check everything, post nothing)'
        type: boolean
        default: true

concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SLIDES_BASE_URL: ${{ vars.SLIDES_BASE_URL }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
      IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — daily limit reached (Asia/Bangkok)?
        id: guard
        run: |
          skip=$(node -e '
            const fs=require("fs");const L=JSON.parse(fs.readFileSync("config/limits.json","utf8"));
            const S=JSON.parse(fs.readFileSync("content/state.json","utf8")).published||{};
            const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok"}).format(new Date());
            const burst=L.burst&&today<=L.burst.until; const max=burst?L.burst.perDay:L.perDay;
            const n=Object.values(S).filter(p=>p.bangkokDate===today).length;
            const last=Math.max(0,...Object.values(S).map(p=>Date.parse(p.publishedAt)||0));
            const gapOk=!burst||Date.now()-last>=L.burst.minHoursBetween*3600e3;
            console.log(n>=max||!gapOk?"true":"false");')
          echo "guard: skip=$skip"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.skip != 'true'

      - name: Publish (or dry run)
        if: steps.guard.outputs.skip != 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish.mjs --dry-run
          else
            node scripts/publish.mjs --wait
          fi

      - name: Commit state
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/prune-out.mjs --days=14
          git add -A content/state.json out
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          slug=$(node -e "const s=require('./content/state.json').published||{};const e=Object.entries(s).sort((a,b)=>String(b[1].publishedAt).localeCompare(String(a[1].publishedAt)))[0];console.log(e?e[0]:'state')")
          git commit -m "social: published ${slug}"
          git pull --rebase origin main
          git push

      - name: Telegram on failure
        if: failure()
        run: |
          node scripts/notify.mjs "⚠️ Coloprice IG: воркфлоу публикации упал — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
